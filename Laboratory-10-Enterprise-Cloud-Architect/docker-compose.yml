

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wpuser
      MARIADB_PASSWORD: abangroup123
      MARIADB_ROOT_PASSWORD: abangroup123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: abangroup123
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - frontend
      - backend

volumes:
  db_data:
  wordpress_data:

networks:
  frontend:
  backend:
